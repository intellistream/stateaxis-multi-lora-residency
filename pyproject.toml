[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stateaxis-multi-lora-residency"
version = "0.2.0"
description = "ECPA-bound StateAxis heterogeneous multi-LoRA residency MOD"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.12", "vllm-hust-ext==0.2.0.dev0"]

[project.entry-points."vllm_hust.extension_bundles"]
"org.vllm-hust.stateaxis-multi-lora-residency" = "stateaxis_multi_lora_residency"

[project.entry-points."stateaxis.mod_handlers"]
multi_lora_residency = "stateaxis_multi_lora_residency:multi_lora_residency"

[tool.hatch.build.targets.wheel]
packages = ["src/stateaxis_multi_lora_residency"]

[tool.hatch.build.targets.wheel.force-include]
"fixtures/qwen2.5-14b" = "stateaxis_multi_lora_residency/fixtures/qwen2.5-14b"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
